<script type="text/template7" id="tmpl-doctors">
<div class="card doctor-card">

    <div class="doctor-name">{{name}}</div>
    <div class="doctor-date">{{prof}}</div>
  </div>
  <div class="card-content hidden"><img src="img/petri-dish.svg" width="100%"></div>
  <div class="card-footer no-border">
    <a href="{{link}}.html?id={{i}}" class="link">Записаться</a>
  </div>
</div>
</script>

        </div>
        </a>
    </li>
    {{/each}}
</script>
